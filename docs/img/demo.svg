<clipPath id="c"><rect x="0" y="32" width="750" height="529"/></clipPath>
<rect class="bg" width="750" height="563" rx="9"/><rect class="edge" x=".5" y=".5" width="749" height="562" rx="9"/>
<circle class="dot" cx="18" cy="17" r="5"/><circle class="dot" cx="36" cy="17" r="5"/><circle class="dot" cx="54" cy="17" r="5"/>
<text class="title" x="375" y="21" text-anchor="middle" style="animation:none">a real session, recorded by docs/demo/record.py</text>
<g clip-path="url(#c)"><g class="screen">
<text x="16" y="48" style="animation-name:a0"><tspan class="say"># Four things must exist for this to be done.</tspan></text>
<text x="16" y="67" style="animation-name:a1"><tspan class="prompt">$ </tspan><tspan class="cmd">gitdone init --rows "Sign-in, Search, Export, Reports" --hook</tspan></text>
<rect class="mark" x="32" y="53" width="524" height="19" style="animation-name:m1;animation-timing-function:steps(61)"/>
<text x="16" y="86" style="animation-name:a2">wrote .gitdone.json, status-table.md (4 rows) and STATUS.md</text>
<text x="16" y="105" style="animation-name:a3">All: strict 0% (0/4), weighted 0% · next: row 1 (Sign-in)</text>
<text x="16" y="143" style="animation-name:a5"><tspan class="say"># The agent says sign-in shipped, and names a commit from its spike branch.</tspan></text>
<text x="16" y="162" style="animation-name:a6"><tspan class="prompt">$ </tspan><tspan class="cmd">gitdone shipped 1 705af2a</tspan></text>
<rect class="mark" x="32" y="148" width="243" height="19" style="animation-name:m6;animation-timing-function:steps(25)"/>
<text x="16" y="181" style="animation-name:a7"><tspan class="bad">refused, nothing changed: commit 705af2a is not on main</tspan></text>
<text x="16" y="200" style="animation-name:a8">Still on a branch? Record it with: gitdone mark 1 built --branch NAME</text>
<text x="16" y="238" style="animation-name:a10"><tspan class="say"># The commit that really landed:</tspan></text>
<text x="16" y="257" style="animation-name:a11"><tspan class="prompt">$ </tspan><tspan class="cmd">gitdone shipped 1 660d81a</tspan></text>
<rect class="mark" x="32" y="243" width="243" height="19" style="animation-name:m11;animation-timing-function:steps(25)"/>
<text x="16" y="276" style="animation-name:a12"><tspan class="good">row 1: Not built → Live (verified: commit 660d81a is on main)</tspan></text>
<text x="16" y="295" style="animation-name:a13">All: strict 25% (1/4), weighted 25% · next: row 2 (Search)</text>
<text x="16" y="314" style="animation-name:a14">to commit: git add status-table.md STATUS.md</text>
<text x="16" y="352" style="animation-name:a16"><tspan class="say"># Someone types Live into the table by hand, with nothing behind it.</tspan></text>
<text x="16" y="371" style="animation-name:a17"><tspan class="prompt">$ </tspan><tspan class="cmd">git add -A &amp;&amp; git commit -m 'Search is live'</tspan></text>
<rect class="mark" x="32" y="357" width="391" height="19" style="animation-name:m17;animation-timing-function:steps(44)"/>
<text x="16" y="390" style="animation-name:a18"><tspan class="bad">FAIL row 2 names no commit, pull request or tag; run `gitdone shipped 2 &lt;commit&gt;`</tspan></text>
<text x="16" y="409" style="animation-name:a19"><tspan class="bad">result: FAIL in --strict, evidence is missing or partly disproved</tspan></text>
<text x="16" y="447" style="animation-name:a21"><tspan class="say"># Later, sign-in is reverted on main. The claim stops holding.</tspan></text>
<text x="16" y="466" style="animation-name:a22"><tspan class="prompt">$ </tspan><tspan class="cmd">gitdone check</tspan></text>
<rect class="mark" x="32" y="452" width="149" height="19" style="animation-name:m22;animation-timing-function:steps(13)"/>
<text x="16" y="485" style="animation-name:a23"><tspan class="bad">FAIL row 1 (Live): commit 660d81a was reverted on main by 3f6610b</tspan></text>
<text x="16" y="504" style="animation-name:a24">  what is true now? gitdone mark 1 &lt;kind&gt; &lt;words&gt;, or shipped 1 &lt;the new commit&gt;</text>
<text x="16" y="523" style="animation-name:a25"><tspan class="bad">result: FAIL, 1 contradicted or inconsistent</tspan></text>
<text x="16" y="561" style="animation-name:a27"><tspan class="say"># Your agent says it shipped. Git decides.</tspan></text>
</g></g>
</svg>
