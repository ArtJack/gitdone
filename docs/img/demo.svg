@keyframes a3{0%,11.393%{opacity:1}11.421%,22.999%{opacity:0}23.028%,100%{opacity:1}}
@keyframes a5{0%,11.393%{opacity:1}11.421%,28.952%{opacity:0}28.980%,100%{opacity:1}}
@keyframes a6{0%,11.393%{opacity:1}11.421%,31.515%{opacity:0}31.544%,100%{opacity:1}}
@keyframes m6{0%,11.393%{transform:translateX(243px)}11.421%,31.515%{transform:translateX(0)}34.007%,100%{transform:translateX(243px)}}
@keyframes a7{0%,11.393%{opacity:1}11.421%,35.289%{opacity:0}35.318%,100%{opacity:1}}
@keyframes a8{0%,11.393%{opacity:1}11.421%,35.545%{opacity:0}35.574%,100%{opacity:1}}
@keyframes a10{0%,11.393%{opacity:1}11.421%,41.498%{opacity:0}41.527%,100%{opacity:1}}
@keyframes a11{0%,11.393%{opacity:1}11.421%,44.062%{opacity:0}44.090%,100%{opacity:1}}
@keyframes m11{0%,11.393%{transform:translateX(243px)}11.421%,44.062%{transform:translateX(0)}46.554%,100%{transform:translateX(243px)}}
@keyframes a12{0%,11.393%{opacity:1}11.421%,47.835%{opacity:0}47.864%,100%{opacity:1}}
@keyframes a13{0%,11.393%{opacity:1}11.421%,48.092%{opacity:0}48.120%,100%{opacity:1}}
@keyframes a14{0%,11.393%{opacity:1}11.421%,48.348%{opacity:0}48.377%,100%{opacity:1}}
@keyframes a16{0%,11.393%{opacity:1}11.421%,54.301%{opacity:0}54.329%,100%{opacity:1}}
@keyframes a17{0%,11.393%{opacity:1}11.421%,56.864%{opacity:0}56.893%,100%{opacity:1}}
@keyframes m17{0%,11.393%{transform:translateX(391px)}11.421%,56.864%{transform:translateX(0)}61.250%,100%{transform:translateX(391px)}}
@keyframes a18{0%,11.393%{opacity:1}11.421%,62.532%{opacity:0}62.561%,100%{opacity:1}}
@keyframes a19{0%,11.393%{opacity:1}11.421%,62.788%{opacity:0}62.817%,100%{opacity:1}}
@keyframes a21{0%,11.393%{opacity:1}11.421%,68.741%{opacity:0}68.770%,100%{opacity:1}}
@keyframes a22{0%,11.393%{opacity:1}11.421%,71.304%{opacity:0}71.333%,100%{opacity:1}}
