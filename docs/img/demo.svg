<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 563" width="750" height="563" role="img" aria-label="A terminal session: a commit from a spike branch is refused, the commit on main is accepted, a hand-edited claim stops the commit, and a reverted commit fails the gate.">
<style>
.bg{fill:#14161a}.edge{fill:none;stroke:#2c3036}.dot{fill:#3a3f46}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:13px;fill:#d7dae0;white-space:pre}
.say{fill:#8b93a1}.cmd{fill:#f0f2f5}.prompt{fill:#6cb6ff}.bad{fill:#ff7b72}.good{fill:#56d364}.title{fill:#8b93a1;font-size:12px}
.mark{fill:#14161a}
text,.mark,.screen{animation-duration:35.11s;animation-iteration-count:infinite;animation-fill-mode:both}.screen{animation-name:scroll;animation-timing-function:step-end}.screen{transform:translateY(-19px)}@media (prefers-reduced-motion:reduce){text,.mark,.screen{animation:none!important}.mark{display:none}}
@keyframes a0{0%,11.393%{opacity:1}11.421%,12.817%{opacity:0}12.845%,100%{opacity:1}}
