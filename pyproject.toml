[project]
name = "gitdone"
dynamic = ["version"]
description = "A percent done you can defend: strict and weighted completion from one plan file and one status table, each claim held to git."
# Not README.md: that one is full of links relative to the repository, which resolve to nothing on PyPI. `python3 docs/demo/pypi_readme.py --write` makes this one from it.
readme = "README-pypi.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "ArtJack" }]
keywords = ["status", "progress", "percent-done", "burn-up", "evidence", "definition-of-done", "traceability", "pre-commit", "markdown", "coding-agents", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/ArtJack/gitdone"
Repository = "https://github.com/ArtJack/gitdone"
Issues = "https://github.com/ArtJack/gitdone/issues"
Changelog = "https://github.com/ArtJack/gitdone/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/ArtJack"

[project.scripts]
gitdone = "gitdone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "gitdone/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gitdone"]

[tool.hatch.build.targets.wheel.force-include]
# `install-skill` copies this file, and a wheel holds nothing outside the package.
"skills/status/SKILL.md" = "gitdone/_skill/SKILL.md"

[tool.hatch.build.targets.sdist]
# An allowlist: an untracked folder is absent by default rather than published.
include = [
    "/gitdone",
    "/skills/status/SKILL.md",
    "/README-pypi.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Correctness only. The narrative comment style is a house idiom, and `ruff format` would churn it for no gain.
select = ["F", "E9", "C90", "E741"]

[tool.ruff.lint.mccabe]
max-complexity = 30
