name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Correctness rules only: the comment layout in this repository is deliberate.
      - run: uvx ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor is what a stock Mac has; the top is the newest release.
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run the suite with nothing installed
        env:
          PYTHONUTF8: "1"  # what a test reads back from the engine's output. test_docs holds the engine itself to naming its encoding
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: The wheel installs and runs, on the floor and with no checkout on the path
        working-directory: ${{ runner.temp }}
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          uvx --python 3.9 --from "$wheel" gitdone --version
          git init -q demo && cd demo
          uvx --python 3.9 --from "$wheel" gitdone install-skill --into .
          test -f .claude/skills/gitdone/SKILL.md
