<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 333" width="760" height="333" role="img" aria-labelledby="t d">
<title id="t">GitDone: how far along</title>
<desc id="d">All: strict 84%, 42 of 50 rows, weighted 86%</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6d68;--grid:#e1e0d9;--axis:#c3c2b7;--edge:rgba(11,11,11,.10);--strict:#2a78d6;--weighted:#eb6834;--scope:#52514e}
